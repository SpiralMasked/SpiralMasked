<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Buildly · Car Build Planner</title>
<style>
  /* ---------- THEME ---------- */
  :root {
    --bg: #0a0a10;
    --surface: #131320;
    --surface-2: #1a1a28;
    --surface-3: #222234;
    --border: #2a2a3c;
    --border-strong: #3a3a52;
    --text: #f2f2f7;
    --muted: #8e8ea3;
    --subtle: #5a5a72;

    --brand: #1c69d4;          /* BMW blue */
    --brand-2: #0066b1;        /* deeper BMW blue */
    --brand-glow: rgba(28, 105, 212, 0.35);

    --m-red: #c8102e;          /* ///M red */
    --m-purple: #6c5ce7;
    --m-tricolor: linear-gradient(135deg, #1c69d4 0%, #6c5ce7 50%, #c8102e 100%);

    --success: #00d97e;
    --warning: #f7b731;
    --danger: #ff4d6d;

    --shadow-sm: 0 2px 6px rgba(0,0,0,0.35);
    --shadow-md: 0 6px 20px rgba(0,0,0,0.45);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.6);

    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Display", Roboto, Inter, sans-serif;
    background: radial-gradient(ellipse at top, #16162a 0%, var(--bg) 60%);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
    line-height: 1.5;
    overflow-x: hidden;
  }

  /* ---------- LAYOUT ---------- */
  .app {
    display: grid;
    grid-template-columns: 220px 1fr;
    grid-template-rows: 64px 1fr;
    grid-template-areas: "sidebar header" "sidebar main";
    height: 100vh;
  }
  .topbar {
    grid-area: header;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
    background: rgba(19, 19, 32, 0.85);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(10px);
    z-index: 10;
  }
  .sidebar {
    grid-area: sidebar;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 20px 0;
  }
  .main {
    grid-area: main;
    overflow-y: auto;
    padding: 28px 36px 96px 36px;
  }

  /* ---------- LOGO ---------- */
  .brand {
    display: flex; align-items: center; justify-content: center;
    padding: 16px 16px 20px 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .brand-logo {
    height: 64px; width: auto; max-width: 220px;
    flex-shrink: 0;
    display: block;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
  }

  /* ---------- NAV ---------- */
  .nav { display: flex; flex-direction: column; gap: 2px; padding: 0 12px; }
  .nav button {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    border: none; background: transparent;
    color: var(--muted);
    font-size: 13px; font-weight: 500;
    text-align: left; cursor: pointer;
    border-radius: var(--radius-sm);
    transition: all 0.15s;
  }
  .nav button:hover { background: var(--surface-2); color: var(--text); }
  .nav button.active {
    background: linear-gradient(90deg, rgba(28,105,212,0.18) 0%, transparent 100%);
    color: var(--text);
    border-left: 2px solid var(--brand);
    padding-left: 12px;
  }
  .nav .icon { width: 16px; height: 16px; flex-shrink: 0; }
  .nav-heading {
    font-size: 10px; font-weight: 700; color: var(--subtle);
    text-transform: uppercase; letter-spacing: 1.5px;
    padding: 14px 14px 6px 14px;
  }

  /* ---------- TOPBAR ---------- */
  .build-selector {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface-2);
    padding: 8px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: border-color 0.15s;
    min-width: 260px;
  }
  .build-selector:hover { border-color: var(--border-strong); }
  .build-selector .swatch { width: 18px; height: 18px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); }
  .build-selector .name { font-weight: 700; }
  .build-selector .sub { color: var(--muted); font-size: 11px; }
  .build-selector .chevron { margin-left: auto; color: var(--muted); }
  .top-actions { display: flex; align-items: center; gap: 10px; }

  /* ---------- BUTTONS ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .btn:hover { background: var(--surface-3); border-color: var(--border-strong); }
  .btn-primary {
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
  }
  .btn-primary:hover { background: var(--brand-2); border-color: var(--brand-2); box-shadow: 0 4px 12px var(--brand-glow); }
  .btn-danger { color: var(--danger); border-color: rgba(255,77,109,0.3); }
  .btn-danger:hover { background: rgba(255,77,109,0.1); border-color: var(--danger); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 6px 10px; }
  .btn-ghost:hover { color: var(--text); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-icon { padding: 8px; }
  .btn-m {
    background: var(--m-tricolor);
    border: none;
    color: #fff;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .btn-m:hover { box-shadow: 0 4px 18px rgba(200,16,46,0.4); }

  /* ---------- DROPDOWN ---------- */
  .dropdown {
    position: relative;
  }
  .dropdown-menu {
    position: absolute;
    top: calc(100% + 6px); right: 0;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px;
    min-width: 240px;
    box-shadow: var(--shadow-lg);
    z-index: 50;
    display: none;
  }
  .dropdown.open .dropdown-menu { display: block; }
  .dropdown-item {
    padding: 8px 12px; border-radius: 6px;
    cursor: pointer; display: flex; align-items: center; gap: 10px;
    font-size: 13px;
  }
  .dropdown-item:hover { background: var(--surface-3); }
  .dropdown-divider { height: 1px; background: var(--border); margin: 6px 0; }

  /* ---------- HEADER ---------- */
  .page-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    margin-bottom: 28px;
    gap: 24px;
  }
  .page-title h1 {
    font-size: 26px; font-weight: 800;
    letter-spacing: -0.5px;
    display: flex; align-items: center; gap: 12px;
  }
  .page-title .nickname {
    background: var(--m-tricolor);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .page-title .meta {
    color: var(--muted); font-size: 13px;
    margin-top: 4px;
  }
  .page-title .meta b { color: var(--text); font-weight: 600; }

  /* ---------- STAT CARDS ---------- */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 28px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 18px 20px;
    border-radius: var(--radius);
    position: relative;
    overflow: hidden;
  }
  .stat::before {
    content: ""; position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--brand);
  }
  .stat.m::before { background: var(--m-tricolor); }
  .stat .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600; }
  .stat .value { font-size: 26px; font-weight: 800; margin-top: 6px; letter-spacing: -0.5px; }
  .stat .delta { font-size: 11px; color: var(--success); margin-top: 4px; font-weight: 600; }
  .stat .delta.neg { color: var(--danger); }

  /* ---------- SECTIONS ---------- */
  .section { margin-bottom: 28px; }
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .section-title {
    font-size: 14px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--text);
    display: flex; align-items: center; gap: 8px;
  }
  .section-title .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }
  .section-subtitle { font-size: 12px; color: var(--muted); }

  /* ---------- CARD ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .card-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .card-body { padding: 18px; }
  .card-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }

  /* ---------- GRID ---------- */
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  .grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  @media (max-width: 1100px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
  }

  /* ---------- MOD LIST ---------- */
  .mod-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .chip {
    padding: 6px 12px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--border);
    font-size: 11px; font-weight: 600; color: var(--muted);
    cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px;
    transition: all 0.15s;
  }
  .chip:hover { color: var(--text); border-color: var(--border-strong); }
  .chip.active { background: var(--brand); border-color: var(--brand); color: #fff; }

  .cost-banner {
    background: linear-gradient(135deg, rgba(28,105,212,0.12) 0%, rgba(108,92,231,0.12) 100%);
    border: 1px solid var(--border);
    padding: 18px 22px;
    border-radius: var(--radius);
    margin-bottom: 18px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 18px;
  }
  .cost-banner .total { display: flex; align-items: baseline; gap: 6px; }
  .cost-banner .total .num { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; }
  .cost-banner .total .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; }
  .cost-breakdown { display: flex; gap: 12px; flex-wrap: wrap; }
  .cost-pill {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface); padding: 6px 10px; border-radius: 999px;
    border: 1px solid var(--border);
    font-size: 11px; font-weight: 600;
  }
  .cost-pill .cat-dot { width: 6px; height: 6px; border-radius: 50%; }

  .mod-list { display: flex; flex-direction: column; gap: 8px; }
  .mod-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    display: grid;
    grid-template-columns: auto 1fr auto auto auto;
    gap: 14px; align-items: center;
    transition: border-color 0.15s;
  }
  .mod-item:hover { border-color: var(--border-strong); }
  .mod-item .cat-badge {
    width: 40px; height: 40px;
    border-radius: 8px;
    display: grid; place-items: center;
    font-weight: 800; font-size: 11px;
    color: #fff;
  }
  .mod-item .info .name { font-weight: 700; }
  .mod-item .info .sub { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .mod-item .info .sub .brand { color: var(--brand); font-weight: 600; }
  .mod-item .info .sub .pn { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; }
  .mod-item .info .notes { font-size: 12px; color: var(--muted); margin-top: 4px; font-style: italic; }
  .mod-item .stat-grid { display: flex; gap: 12px; font-size: 11px; }
  .mod-item .stat-grid div { display: flex; flex-direction: column; align-items: flex-end; }
  .mod-item .stat-grid .lbl { color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; font-size: 9px; font-weight: 700; }
  .mod-item .stat-grid .val { font-weight: 700; }
  .mod-item .stat-grid .val.pos { color: var(--success); }
  .mod-item .stat-grid .val.neg { color: var(--warning); }
  .mod-item .cost { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; }
  .mod-item .actions { display: flex; gap: 4px; }

  /* ---------- GALLERY ---------- */
  .ba-compare {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: var(--surface-2);
    border-radius: var(--radius);
    overflow: hidden;
    user-select: none;
    border: 1px solid var(--border);
  }
  .ba-compare img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .ba-compare .ba-after { clip-path: inset(0 0 0 50%); }
  .ba-compare .ba-slider {
    position: absolute; top: 0; bottom: 0;
    left: 50%; width: 3px;
    background: #fff;
    cursor: ew-resize;
    box-shadow: 0 0 12px rgba(0,0,0,0.5);
    z-index: 4;
  }
  .ba-compare .ba-handle {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--brand);
    border: 3px solid #fff;
    display: grid; place-items: center;
    color: #fff;
    font-weight: 800;
    z-index: 5;
  }
  .ba-compare .ba-label {
    position: absolute; top: 12px;
    padding: 4px 10px;
    background: rgba(0,0,0,0.7);
    border-radius: 4px;
    font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase;
    z-index: 3;
  }
  .ba-compare .ba-label.before { left: 12px; }
  .ba-compare .ba-label.after { right: 12px; }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
    margin-top: 18px;
  }
  .gallery-tile {
    aspect-ratio: 4/3;
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface-2);
    border: 1px solid var(--border);
    position: relative;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .gallery-tile:hover { transform: scale(1.02); }
  .gallery-tile img { width: 100%; height: 100%; object-fit: cover; }
  .gallery-tile .tag {
    position: absolute; top: 8px; left: 8px;
    background: rgba(0,0,0,0.7);
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .gallery-tile .tag.before { color: #fff; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); }
  .gallery-tile .tag.after { color: var(--brand); background: rgba(28,105,212,0.85); }
  .gallery-tile .tag.progress { color: #fff; background: rgba(108,92,231,0.85); }
  .gallery-tile .cap {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 10px;
    background: linear-gradient(transparent, rgba(0,0,0,0.85));
    font-size: 11px;
  }
  .gallery-empty {
    padding: 40px;
    text-align: center;
    color: var(--muted);
    background: var(--surface);
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius);
  }

  /* ---------- WISHLIST ---------- */
  .w-list { display: flex; flex-direction: column; gap: 8px; }
  .w-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    gap: 14px; align-items: center;
  }
  .pri-pill {
    padding: 4px 10px; border-radius: 4px;
    font-size: 10px; font-weight: 800; letter-spacing: 1px;
    text-transform: uppercase;
  }
  .pri-must { background: rgba(255,77,109,0.15); color: var(--danger); border: 1px solid rgba(255,77,109,0.3); }
  .pri-should { background: rgba(247,183,49,0.15); color: var(--warning); border: 1px solid rgba(247,183,49,0.3); }
  .pri-could { background: rgba(0,217,126,0.15); color: var(--success); border: 1px solid rgba(0,217,126,0.3); }

  /* ---------- CHARTS ---------- */
  .bar-chart { display: flex; flex-direction: column; gap: 12px; }
  .bar-row { display: grid; grid-template-columns: 120px 1fr 70px; gap: 10px; align-items: center; font-size: 12px; }
  .bar-track { height: 18px; background: var(--surface-2); border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }
  .bar-row .amt { text-align: right; font-weight: 700; font-size: 11px; }

  /* ---------- TIMELINE ---------- */
  .timeline { position: relative; padding-left: 22px; }
  .timeline::before {
    content: ""; position: absolute;
    left: 6px; top: 4px; bottom: 4px;
    width: 2px; background: var(--border);
  }
  .t-item { position: relative; padding-bottom: 14px; }
  .t-item::before {
    content: ""; position: absolute;
    left: -22px; top: 4px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--brand);
    border: 3px solid var(--bg);
  }
  .t-item .t-date { font-size: 11px; color: var(--muted); font-weight: 600; }
  .t-item .t-name { font-weight: 700; }
  .t-item .t-cost { color: var(--success); font-weight: 700; font-size: 12px; margin-left: 6px; }

  /* ---------- FORM ---------- */
  .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
  .form-row label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .form-row input, .form-row select, .form-row textarea {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 11px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    width: 100%;
  }
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--brand-glow);
  }
  .form-row textarea { resize: vertical; min-height: 60px; }
  .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 14px; border-top: 1px solid var(--border); margin-top: 14px; }

  /* ---------- MODAL ---------- */
  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    width: 100%; max-width: 540px;
    max-height: 90vh; overflow-y: auto;
    box-shadow: var(--shadow-lg);
  }
  .modal-header {
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-header h3 { font-size: 16px; font-weight: 700; }
  .modal-close { background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 6px; border-radius: 4px; font-size: 18px; }
  .modal-close:hover { color: var(--text); background: var(--surface-2); }
  .modal-body { padding: 22px; }

  /* ---------- TOAST ---------- */
  .toast {
    position: fixed; bottom: 20px; right: 20px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 12px 18px;
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    font-size: 13px; font-weight: 600;
    z-index: 200;
    display: none;
    animation: slideIn 0.2s ease-out;
  }
  .toast.show { display: block; }
  .toast.success { border-color: var(--success); color: var(--success); }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  /* ---------- SHARE ---------- */
  .share-card {
    background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
    border: 1px solid var(--border);
    padding: 24px;
    border-radius: var(--radius);
  }
  .code-block {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 12px;
    border-radius: 6px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    color: var(--muted);
    max-height: 200px; overflow: auto;
    word-break: break-all;
    white-space: pre-wrap;
  }

  /* ---------- EMPTY STATE ---------- */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    background: var(--surface);
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius);
  }
  .empty .icon {
    width: 60px; height: 60px;
    margin: 0 auto 16px;
    opacity: 0.4;
  }
  .empty h4 { color: var(--text); font-size: 16px; margin-bottom: 6px; font-weight: 700; }
  .empty p { font-size: 13px; margin-bottom: 16px; }

  /* ---------- ICONS (inline) ---------- */
  .ico { width: 14px; height: 14px; flex-shrink: 0; }

  /* ---------- UTILITIES ---------- */
  .hidden { display: none !important; }
  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 4px;
    background: var(--surface-2); border: 1px solid var(--border);
    font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
    color: var(--muted); text-transform: uppercase;
  }

  /* ---------- SWATCH PICKER ---------- */
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
  .swatch-opt {
    width: 28px; height: 28px;
    border-radius: 6px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.15s;
  }
  .swatch-opt:hover { transform: scale(1.1); }
  .swatch-opt.active { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-glow); }

  /* ---------- PRINT FRIENDLY ---------- */
  @media print {
    body { background: #fff; color: #000; }
    .sidebar, .topbar, .nav-heading, .btn, .actions { display: none !important; }
    .app { grid-template-columns: 1fr; grid-template-rows: 1fr; grid-template-areas: "main"; }
    .stat, .card, .cost-banner, .mod-item, .w-item { background: #fff; color: #000; border-color: #ddd; }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }
</style>
</head>

}

  try {

    updateStorageUsage();

    toast('Storage full — try exporting & clearing old photos', 'error');

}

  if (n == null || isNaN(n)) return '—';
  const s = new Intl.NumberFormat('en-US', { style: 'currency', currency: state.currency, maximumFractionDigits: 0 }).format(n);
  return s;
};
const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : '—';
const escapeHtml = (s = '') => s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
function toast(msg, kind = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + kind;
  setTimeout(() => el.className = 'toast', 2200);
}
function activeBuild() { return state.builds.find(b => b.id === state.activeBuildId) || null; }
function newBuild() { return { id: rid(), nickname: '', year: '', make: '', model: '', trim: '', vin: '', plate: '', color: '#1c69d4', startDate: new Date().toISOString().slice(0,10), goal: '', mods: [], gallery: [], wishlist: [], milestones: [] }; }

/* ============================================================
   ROUTING / NAV
   ============================================================ */
let currentView = 'overview';
function setView(v) {
  currentView = v;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.view === v));

}

/* ============================================================

   ============================================================ */

function selectBuild(id) { state.activeBuildId = id; saveState(); document.getElementById('buildSelector').classList.remove('open'); render(); }
function renderBuildSelector() {

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  renderBuildSelector();
  renderBuildDropdown();
  updateStorageUsage();
  const b = activeBuild();
  const main = document.getElementById('main');
  if (!b) {
    main.innerHTML = `<div class="empty">
      <div style="font-size:48px;margin-bottom:16px">🏁</div>
      <h4>Welcome to Buildly</h4>
      <p>Builds can be a project car, a daily driver dream list, or even an aspirational track beast. Start your first one.</p>
      <button class="btn btn-primary" onclick="openModal('newBuild')">+ Create Your First Build</button>
    </div>`;
    return;
  }
  switch (currentView) {
    case 'overview': main.innerHTML = renderOverview(b); break;
    case 'mods':     main.innerHTML = renderMods(b); bindModsView(); break;
    case 'gallery':  main.innerHTML = renderGallery(b); bindGalleryView(b); break;
    case 'wishlist': main.innerHTML = renderWishlist(b); break;
    case 'stats':    main.innerHTML = renderStats(b); break;
    case 'share':    main.innerHTML = renderShare(b); break;
  }
}

function categoryBreakdownHtml(b) {
  if (!b.mods.length) return '<div class="empty" style="padding:24px"><p>Add mods to see breakdown.</p></div>';
  const map = {};
  let total = 0;
  b.mods.forEach(m => { const c = m.category || 'other'; map[c] = (map[c] || 0) + (Number(m.cost) || 0); total += (Number(m.cost) || 0); });
  return `
    <div class="bar-chart">
      ${Object.entries(map).sort((a, c) => c[1] - a[1]).map(([c, v]) => {
        const pct = total ? (v / total * 100) : 0;
        return `<div class="bar-row">
          <div style="display:flex;align-items:center;gap:6px;font-weight:600">
            <span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${CATEGORIES[c]?.color || '#666'}"></span>
            ${CATEGORIES[c]?.label || c}

          <div class="bar-track"><div class="bar-fill" style="width:${pct.toFixed(1)}%;background:${CATEGORIES[c]?.color || '#666'}"></div></div>
          <div class="amt">${fmtMoney(v)}</div>
        </div>`;
      }).join('')}
    </div>`;
}

    return (c.installDate || '').localeCompare(a.installDate || '');
  });
  const total = filtered.reduce((s, m) => s + (Number(m.cost) || 0), 0);
  const catTotals = {};

  return `
    <div class="page-header">
      <div class="page-title">
        <h1>Modifications</h1>

  `;

        `).join('')}
      </div>`}

  `;
}
function bindGalleryView(b) {
  const el = document.getElementById('baCompare');
  if (!el) return;
  const after = el.querySelector('.ba-after');
  const slider = el.getElementById && el.getElementById('baSlider');
  const handle = document.getElementById('baHandle');
  const update = (pct) => {
    el.querySelector('.ba-after').style.clipPath = `inset(0 0 0 ${pct}%)`;
    document.getElementById('baSlider').style.left = pct + '%';
    document.getElementById('baHandle').style.left = pct + '%';
  };
  update(50);
  let dragging = false;
  const onMove = (e) => {
    if (!dragging) return;
    const rect = el.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const pct = Math.max(0, Math.min(100, (x / rect.width) * 100));
    update(pct);
  };
  el.addEventListener('mousedown', (e) => { dragging = true; onMove(e); });
  el.addEventListener('touchstart', (e) => { dragging = true; onMove(e); });
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove);
  window.addEventListener('mouseup', () => dragging = false);
  window.addEventListener('touchend', () => dragging = false);
}

  activeBuild().gallery = activeBuild().gallery.filter(g => g.id !== id);

/* ============================================================
   STATS VIEW
   ============================================================ */
function renderStats(b) {
  const total = b.mods.reduce((s, m) => s + (Number(m.cost) || 0), 0);
  const totalPower = b.mods.reduce((s, m) => s + (Number(m.powerGain) || 0), 0);
  const totalWeight = b.mods.reduce((s, m) => s + (Number(m.weightDelta) || 0), 0);
  const monthsActive = b.startDate ? Math.max(1, Math.round((new Date() - new Date(b.startDate)) / (1000*60*60*24*30))) : 1;
  const catCounts = {};
  b.mods.forEach(m => catCounts[m.category] = (catCounts[m.category] || 0) + 1);
  const topCat = Object.entries(catCounts).sort((a,c)=>c[1]-a[1])[0];

  return `
    <div class="page-header">
      <div class="page-title">
        <h1>Build Statistics</h1>
        <div class="meta">${monthsActive} months in the build · ${b.mods.length} mods installed</div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat m">
        <div class="label">Total Investment</div>
        <div class="value">${fmtMoney(total)}</div>
        <div class="delta">${fmtMoney(total / Math.max(monthsActive, 1))} / month avg</div>
      </div>
      <div class="stat">
        <div class="label">Cost per Horsepower</div>
        <div class="value">${totalPower > 0 ? fmtMoney(Math.round(total / totalPower)) : '—'}</div>
        <div class="delta">${totalPower > 0 ? totalPower + 'hp gained' : 'no power mods'}</div>
      </div>
      <div class="stat">
        <div class="label">Net Weight</div>
        <div class="value">${totalWeight} <span style="font-size:14px;color:var(--muted)">kg</span></div>
        <div class="delta">${totalWeight < 0 ? 'stripped' : totalWeight > 0 ? 'added' : 'neutral'}</div>
      </div>
      <div class="stat">
        <div class="label">Top Category</div>
        <div class="value" style="font-size:18px">${topCat ? CATEGORIES[topCat[0]]?.label : '—'}</div>
        <div class="delta">${topCat ? topCat[1] + ' mods' : '—'}</div>
      </div>
      <div class="stat">
        <div class="label">Cost Efficiency</div>
        <div class="value">${b.mods.length ? fmtMoney(Math.round(total / b.mods.length)) : '—'}</div>
        <div class="delta">avg per mod</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-header"><strong>Spend by Category</strong><span class="pill" style="margin-left:auto">${fmtMoney(total)}</span></div>
        <div class="card-body">
          ${categoryBreakdownHtml(b)}
        </div>
      </div>

      <div class="card">
        <div class="card-header"><strong>Build Timeline</strong><span class="pill" style="margin-left:auto">${b.mods.length} mods</span></div>
        <div class="card-body">
          ${b.mods.length === 0 ? '<div class="empty" style="padding:24px"><p>No mods yet.</p></div>' :
            `<div class="timeline">${[...b.mods].sort((a,c)=>(c.installDate||'').localeCompare(a.installDate||'')).map(m=>{
              const cat = CATEGORIES[m.category] || CATEGORIES.other;
              return `<div class="t-item">
                <div class="t-date">${fmtDate(m.installDate)} · <span style="color:${cat.color}">${cat.label}</span></div>
                <div class="t-name">${escapeHtml(m.name)}${m.powerGain ? ' +' + m.powerGain + 'hp' : ''}${m.weightDelta ? ' ' + (m.weightDelta>0?'+':'') + m.weightDelta + 'kg' : ''}<span class="t-cost">${fmtMoney(m.cost)}</span></div>
                ${m.notes ? `<div style="font-size:12px;color:var(--muted);font-style:italic;margin-top:2px">${escapeHtml(m.notes)}</div>` : ''}
              </div>`;
            }).join('')}</div>`}
        </div>
      </div>
    </div>
  `;
}

function downloadJSON() {
  const b = activeBuild();
  if (!b) return;
  const blob = new Blob([JSON.stringify(b, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${(b.nickname || 'build').replace(/\s+/g, '_')}_mgarage.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Build downloaded', 'success');
}
function downloadHTML() {
  const btn = document.getElementById('downloadHtmlBtn');
  const doctype = '<!DOCTYPE html>';
  // Serialize current DOM into a fresh, self-contained HTML file.
  const html = doctype + '\n' + document.documentElement.outerHTML;
  // Embed the current localStorage state under a stable key so a freshly
  // downloaded file still contains the user's builds / mods / photos.
  let stateJson = null;
  try {
    stateJson = localStorage.getItem('mgarage_v1');
  } catch (e) { stateJson = null; }
  const seedTag =
    (stateJson && stateJson !== 'null')
      ? `\n<script type="application/json" id="__seed_state__">${stateJson}<\/script>\n`
      : '';
  // Inject a small bootstrap that re-hydrates state on first run if local
  // storage is empty. Placed right before </body> so it executes after the
  // app's own STATE loader has run.
  const bootstrap =
    '\n<script>(function(){try{var seed=document.getElementById("__seed_state__");' +
    'if(!seed)return;var raw=seed.textContent||"";if(!raw)return;' +
    'var cur=null;try{cur=localStorage.getItem("mgarage_v1");}catch(e){}' +
    'if(cur&&cur.length)return;localStorage.setItem("mgarage_v1",raw);}catch(e){}})();<\/script>\n';
  const finalHtml = seedTag
    ? html.replace('</body>', bootstrap + '</body>')
    : html;

  const blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const stamp = new Date().toISOString().slice(0, 10);
  const a = document.createElement('a');
  a.href = url;
  a.download = `buildly_car-build-planner_${stamp}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);

  // Visual feedback on the button itself.
  if (btn) {
    const original = btn.innerHTML;
    btn.innerHTML =
      '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<polyline points="5 12 10 17 19 7"/></svg> Saved!';
    btn.disabled = true;
    btn.style.opacity = '0.85';
    setTimeout(() => {
      btn.innerHTML = original;
      btn.disabled = false;
      btn.style.opacity = '';
    }, 1600);
  }
  toast('HTML file saved to your computer', 'success');
}
function copyShareText() {
  const b = activeBuild();
  if (!b) return;
  const total = b.mods.reduce((s,m)=>s+(Number(m.cost)||0),0);
  const lines = [
    `${b.nickname || ''} · ${b.year} ${b.make} ${b.model}`,
    b.trim ? `Trim: ${b.trim}` : '',
    b.goal ? `Goal: ${b.goal}` : '',
    '',
    `${b.mods.length} mods · ${fmtMoney(total)} invested`,
    '',
    '— Mod list —',
    ...b.mods.map(m => `· [${(CATEGORIES[m.category]||{}).label || 'Other'}] ${m.name} (${m.brand || '—'}) — ${fmtMoney(m.cost)}${m.powerGain ? ' +'+m.powerGain+'hp' : ''}`),
    '',
    'Built with Buildly'
  ].filter(Boolean);
  navigator.clipboard.writeText(lines.join('\n'));
  toast('Summary copied to clipboard', 'success');
}
function importFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { document.getElementById('importJson').value = reader.result; toast('File loaded', 'success'); };
  reader.readAsText(file);
}
function importJSON() {
  const txt = document.getElementById('importJson').value.trim();
  if (!txt) return toast('Paste a JSON first', 'error');
  try {
    const data = JSON.parse(txt);
    if (!data.nickname && !data.mods) throw new Error('Invalid build payload');
    data.id = rid();
    data.gallery = data.gallery || [];
    data.wishlist = data.wishlist || [];
    data.milestones = data.milestones || [];
    state.builds.push(data);
    state.activeBuildId = data.id;
    saveState(); render();
    toast('Build imported', 'success');
  } catch (e) {
    toast('Invalid JSON: ' + e.message, 'error');
  }
}
function exportAll() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `mgarage_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Full backup downloaded', 'success');
}

        <div class="form-row">
          <label>Description</label>
          <textarea id="msDesc" placeholder="What happened?"></textarea>
        </div>
        <div class="form-actions">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="saveMilestone()">Add Milestone</button>
        </div>
      </div>`;
  }

  if (type === 'manageBuilds') {
    return `
      <div class="modal-header">
        <h3>Manage Builds</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        ${state.builds.map(bd => `
          <div style="display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:var(--surface-2)">
            <div class="swatch" style="width:18px;height:18px;border-radius:4px;background:${bd.color}"></div>
            <div style="flex:1">
              <div style="font-weight:700">${escapeHtml(bd.nickname || bd.year + ' ' + bd.make + ' ' + bd.model)}</div>
              <div style="font-size:11px;color:var(--muted)">${bd.year} ${escapeHtml(bd.make)} ${escapeHtml(bd.model)}</div>
            </div>
            <button class="btn btn-sm" onclick="selectBuild('${bd.id}');closeModal()">Open</button>
            <button class="btn btn-sm btn-danger" onclick="deleteBuildById('${bd.id}')">Delete</button>
          </div>
        `).join('')}
        <div class="form-actions">
          <button class="btn" onclick="closeModal()">Close</button>
        </div>
      </div>`;
  }

  return '<div class="modal-body">Unknown modal</div>';
}

/* ============================================================
   SAVE HANDLERS
   ============================================================ */
function val(id) { return document.getElementById(id).value; }
function valInt(id) { return parseInt(document.getElementById(id).value) || 0; }
function valFloat(id) { return parseFloat(document.getElementById(id).value) || 0; }
function pickColor(c, el) {
  document.getElementById('bColor').value = c;
  document.querySelectorAll('.swatch-opt').forEach(s => s.classList.remove('active'));
  if (el) el.classList.add('active');
  else document.querySelectorAll('.swatch-opt').forEach(s => s.classList.toggle('active', s.style.background.includes(c)));
}
function saveBuild(id, isEdit) {
  const data = isEdit ? activeBuild() : newBuild();
  data.nickname = val('bNickname');
  data.year = valInt('bYear');
  data.make = val('bMake');
  data.model = val('bModel');
  data.trim = val('bTrim');
  data.color = val('bColor');
  data.startDate = val('bStartDate');
  data.goal = val('bGoal');
  data.plate = val('bPlate');
  if (!data.nickname && !data.make) { toast('Need at least a nickname or make/model', 'error'); return; }
  if (!isEdit) {
    state.builds.push(data);
    state.activeBuildId = data.id;
  }
  saveState(); closeModal(); render();
  toast(isEdit ? 'Build updated' : 'Build created', 'success');
}
function saveMod(id, isEdit) {
  const data = {
    id, category: val('mCategory'), name: val('mName'),
    brand: val('mBrand'), partNumber: val('mPartNumber'),
    cost: valFloat('mCost'), installDate: val('mInstallDate'),
    link: val('mLink'), notes: val('mNotes'),
    powerGain: valInt('mPowerGain'), weightDelta: valInt('mWeightDelta')
  };
  if (!data.name) { toast('Part name is required', 'error'); return; }
  const b = activeBuild();
  if (isEdit) {
    const idx = b.mods.findIndex(m => m.id === id);
    if (idx >= 0) b.mods[idx] = data;
  } else {
    b.mods.push(data);
  }
  saveState(); closeModal(); render();
  toast(isEdit ? 'Mod updated' : 'Mod added', 'success');
}
function saveWish(id, isEdit) {
  const data = {
    id, name: val('wName'),
    priority: val('wPriority'),
    targetPrice: valFloat('wTargetPrice'),
    currentBestLink: val('wLink'),
    notes: val('wNotes')
  };
  if (!data.name) { toast('Wishlist item needs a name', 'error'); return; }
  const b = activeBuild();
  if (isEdit) {
    const idx = b.wishlist.findIndex(w => w.id === id);
    if (idx >= 0) b.wishlist[idx] = data;
  } else {
    b.wishlist.push(data);
  }
  saveState(); closeModal(); render();
  toast(isEdit ? 'Wish updated' : 'Wish added', 'success');
}
function saveMilestone() {
  const data = { id: rid(), title: val('msTitle'), date: val('msDate'), desc: val('msDesc') };
  if (!data.title) { toast('Milestone needs a title', 'error'); return; }
  activeBuild().milestones.push(data);
  saveState(); closeModal(); render();
  toast('Milestone added', 'success');
}
function deleteBuild() {
  if (!confirm('Delete this entire build? This cannot be undone.')) return;
  state.builds = state.builds.filter(b => b.id !== state.activeBuildId);
  state.activeBuildId = state.builds[0]?.id || null;
  saveState(); closeModal(); render();
  toast('Build deleted');
}
function deleteBuildById(id) {
  if (!confirm('Delete this build? Cannot be undone.')) return;
  state.builds = state.builds.filter(b => b.id !== id);
  if (state.activeBuildId === id) state.activeBuildId = state.builds[0]?.id || null;
  saveState(); openModal('manageBuilds'); render();
}

/* ============================================================
   PHOTO HANDLING
   ============================================================ */
let pendingPhotoDataUrl = null;
function handlePhotoSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) {
    if (!confirm('This image is large (>5MB) and may quickly fill your local storage. Continue?')) {
      e.target.value = '';
      return;
    }
  }
  const reader = new FileReader();
  reader.onload = () => {
    pendingPhotoDataUrl = reader.result;
    const img = document.getElementById('photoImg');
    const preview = document.getElementById('photoPreview');
    if (img) img.src = pendingPhotoDataUrl;
    if (preview) preview.style.display = 'block';
  };
  reader.readAsDataURL(file);
}
function savePhoto() {
  if (!pendingPhotoDataUrl) { toast('Pick an image first', 'error'); return; }
  const photo = {
    id: rid(),
    type: val('pType'),
    title: val('pTitle'),
    date: val('pDate'),
    note: val('pNote'),
    image: pendingPhotoDataUrl
  };
  activeBuild().gallery.push(photo);
  pendingPhotoDataUrl = null;
  saveState(); closeModal(); render();
  toast('Photo added', 'success');
}

/* ============================================================
   NAV BINDINGS
   ============================================================ */
document.querySelectorAll('#nav button').forEach(b => {
  b.addEventListener('click', () => setView(b.dataset.view));
});

/* ============================================================
   BOOT
   ============================================================ */
updateStorageUsage();
render();

// Save a small overflow hint when storage is getting full
window.addEventListener('error', () => {});
</script>
